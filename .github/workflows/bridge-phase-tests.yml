name: MSFS bridge flight-phase scenarios
on:
  push:
    branches:
      - feature/passenger-experience-map
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  phase-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exercise phase detector (SimConnect-independent)
        run: dotnet run --project tools/simconnect-bridge/PhaseEngine.Tests.csproj --configuration Release
